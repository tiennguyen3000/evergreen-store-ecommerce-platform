version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: app_db }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  app: # Next.js storefront + admin + /api/v1 backend (modular monolith)
    build: { context: .., dockerfile: infra/Dockerfile }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    command: sh -c "npx drizzle-kit push && npm run db:seed && npm run start"
volumes: { pgdata: {}, minio: {} }
